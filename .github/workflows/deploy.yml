name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  CI: true

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.2

      - run: vp i

      - run: vp check

      - run: vp test

      - name: Build
        run: vp build --base=/todoz/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client/
          retention-days: 1

  Publish:
    runs-on: ubuntu-latest
    needs: [Build]

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
